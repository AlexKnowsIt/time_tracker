<div class="leiste" role="list">
  {% for s in zeitleiste.segmente %}
  <div role="listitem" class="{% if s.luecke %}luecke{% else %}block{% endif %}"
       style="flex-grow:{{ s.sekunden|floatformat:0 }};{% if not s.luecke %}background:{{ s.eintrag.kategorie.farbe }}{% endif %}"
       title="{{ s.text }}" aria-label="{{ s.text }}"></div>
  {% endfor %}
</div>
<p class="klein leiste-zeiten"><span>{{ zeitleiste.von|time:"H:i" }}</span><span>{{ zeitleiste.bis|time:"H:i" }}</span></p>
