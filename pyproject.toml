[project]
name = "zeiterfassung"
version = "0.1.0"
description = "Zeiterfassung mit Tagesauswertung"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django~=5.2",
    "gunicorn>=27.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = ["pytest", "pytest-django", "ruff"]
mcp = [
    "mcp>=1.12,<2",
]
# Windows-App (desktop/start.py): waitress statt gunicorn, Fenster per Edge WebView2
desktop = [
    "pyinstaller>=6.11",
    "pywebview>=5.3",
    "waitress>=3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "zeiterfassung.settings_test"
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]  # WhiteNoise: STATIC_ROOT fehlt in Tests

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
